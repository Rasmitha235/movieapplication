<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎬 Watch movies and Review</h1>
        <p>Manage your favorite movies</p>
    </header>

    <main>

        <section class="form-section">

            <h2>Add Movie</h2>

            <form id="movieForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Movie Title"
                    required
                >

                <input
                    type="text"
                    id="genre"
                    placeholder="Genre"
                    required
                >

                <input
                    type="number"
                    id="year"
                    placeholder="Year"
                    required
                >

                <input
                    type="number"
                    id="rating"
                    placeholder="Rating"
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Movie Description"
                ></textarea>

                <button type="submit">
                    Add Movie
                </button>

            </form>

        </section>


        <section>

            <h2>Movies</h2>

            <input
                type="text"
                id="search"
                placeholder="Search movies..."
            >

            <div id="movieList"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
